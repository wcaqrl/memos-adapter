version: 2

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.memos.lpk
  target_arch: amd64

source:
  kind: git
  url: https://github.com/usememos/memos.git
  select:
    strategy: semver-tag
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    exclude_regex: '(?i)(alpha|beta|rc)'

changelog:
  mode: github-release
  git_url: https://github.com/usememos/memos.git

state:
  file: .lazycat-action.lock.yml

update:
  strategy: publish
  allow_downgrade: false

build:
  run_buildscript: false
  prepare:
    mode: images

images:
  - id: memos
    target: service
    service: memos
    source: docker.io/neosmemo/memos:{source_version}
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
    retry:
      enabled: true
      max_attempts: 5
      initial_delay: 2s
      max_delay: 30s
