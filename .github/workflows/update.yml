name: Update Memos for LazyCat
# Repository configuration is verified before upgrade, delivery, and review submission.
run-name: ${{ github.event_name == 'push' && 'Memos → LazyCat [仅检查]' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) && 'Memos → LazyCat [仅检查]' || 'Memos → LazyCat [升级测试、转存、打包并送审]' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - scripts/test-upgrade.sh
      - lazycat-action.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
  schedule:
    # 04:17 UTC = 12:17 China Standard Time.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 勾选＝仅检查；取消勾选＝升级测试、转存镜像、构建 LPK 并提交审核。
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: memos-lazycat-update
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify repository configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify Actions can write adapter state
        shell: bash
        run: git push --dry-run origin "HEAD:${GITHUB_REF_NAME}"
      - name: Check LazyCat developer PAT
        shell: bash
        env:
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
        run: |
          if [[ -z "${LZC_API_TOKEN}" ]]; then
            echo "::error title=Missing LZC_API_TOKEN::Add the LazyCat developer PAT at Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "LZC_API_TOKEN is configured."
      - name: Verify LazyCat application permission
        shell: bash
        env:
          LZC_API_HOST: ${{ secrets.LZC_API_HOST }}
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
        run: |
          api_host="${LZC_API_HOST:-https://appstore.api.lazycat.cloud}"
          response_file="${RUNNER_TEMP}/memos-review-access.json"
          curl --fail --silent --show-error \
            --header "X-API-Token: ${LZC_API_TOKEN}" \
            --output "${response_file}" \
            "${api_host%/}/sdk/v3/developer/app/cloud.lazycat.app.memos/review/list?page=0&size=1"
          python3 - "${response_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              result = json.load(response)
          if result.get("errorCode") != 0:
              message = result.get("msg") or "unknown developer-platform error"
              print(f"::error title=No Memos application permission::{message}")
              raise SystemExit(1)
          print("Developer PAT and cloud.lazycat.app.memos collaborator permission are valid.")
          PY

  upgrade-test:
    name: Verify persistent data upgrade
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Upgrade the current store baseline to the latest stable Memos
        run: ./scripts/test-upgrade.sh

  update:
    needs: [preflight, upgrade-test]
    uses: wcaqrl/lazycat-action/.github/workflows/lazycat.yml@v1
    with:
      config: lazycat-action.yml
      operation: auto
      dry-run: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish-memos]') || inputs.dry-run || false }}
    secrets: inherit
