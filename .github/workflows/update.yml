name: Update Memos for LazyCat
run-name: ${{ github.event_name == 'push' && 'Memos → LazyCat [仅检查]' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) && 'Memos → LazyCat [仅检查]' || 'Memos → LazyCat [升级测试、转存、打包并送审]' }}

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - scripts/test-upgrade.sh
      - lazycat-action.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
  schedule:
    # 04:17 UTC = 12:17 China Standard Time.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 勾选＝仅检查；取消勾选＝升级测试、转存镜像、构建 LPK 并提交审核。
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: memos-lazycat-update
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify repository configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify Actions can write adapter state
        shell: bash
        run: git push --dry-run origin "HEAD:${GITHUB_REF_NAME}"
      - name: Check LazyCat developer PAT
        shell: bash
        env:
          LZC_API_TOKEN: ${{ secrets.LZC_API_TOKEN }}
        run: |
          if [[ -z "${LZC_API_TOKEN}" ]]; then
            echo "::error title=Missing LZC_API_TOKEN::Add the LazyCat developer PAT at Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "LZC_API_TOKEN is configured."

  upgrade-test:
    name: Verify persistent data upgrade
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Upgrade the current store baseline to the latest stable Memos
        run: ./scripts/test-upgrade.sh

  update:
    needs: [preflight, upgrade-test]
    uses: wcaqrl/lazycat-action/.github/workflows/lazycat.yml@v1
    with:
      config: lazycat-action.yml
      operation: auto
      dry-run: ${{ github.event_name == 'push' || inputs.dry-run || false }}
    secrets: inherit
